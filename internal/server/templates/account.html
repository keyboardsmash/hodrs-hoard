{{define "content"}}
  <h2>Your account</h2>
  {{with .Error}}<p class="error">{{.}}</p>{{end}}
  <dl>
    <dt>Username</dt><dd>{{.User.Username}}</dd>
    <dt>Role</dt><dd>{{.User.Role}}</dd>
  </dl>
  <form class="stacked" method="post" action="/account/email">
    <label for="email">Email <span class="hint">(optional)</span></label>
    <input id="email" name="email" type="email" value="{{.Form.Email}}" autocomplete="email">
    <button type="submit">Save email</button>
  </form>
  <section>
    <h3>Password</h3>
    <p><a href="/account/password">Change your password</a></p>
  </section>
  <section>
    <h3>Log out everywhere</h3>
    <p class="hint">Ends your login on every device and browser, including
      "Remember me" on all of them. Useful if you lost a device.</p>
    <form method="post" action="/account/logout-everywhere">
      <button type="submit">Log out everywhere</button>
    </form>
  </section>
{{end}}
