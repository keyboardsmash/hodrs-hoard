{{define "content"}}
  <h2>Welcome</h2>
  <p>Create the first admin account. More users can be added later.</p>
  <p>The <strong>setup code</strong> is printed in the server log when hoard
     starts. It makes sure only whoever runs the server can do this step.</p>
  {{with .Error}}<p class="error">{{.}}</p>{{end}}
  <form class="stacked" method="post" action="/setup">
    <label for="code">Setup code</label>
    <input id="code" name="code" value="{{.Form.Code}}" autocomplete="off" spellcheck="false" required autofocus>
    <label for="username">Username</label>
    <input id="username" name="username" value="{{.Form.Username}}" autocomplete="username" required>
    <label for="email">Email <span class="hint">(optional)</span></label>
    <input id="email" name="email" type="email" value="{{.Form.Email}}" autocomplete="email">
    <label for="password">Password <span class="hint">(at least {{.MinPasswordLen}} characters)</span></label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="{{.MinPasswordLen}}" required>
    <label for="password2">Repeat password</label>
    <input id="password2" name="password2" type="password" autocomplete="new-password" required>
    <button type="submit">Create admin account</button>
  </form>
{{end}}
